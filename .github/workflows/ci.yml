name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Drives `integration-windows` only -- see that job for why it is not on
  # the push path. Weekly rather than nightly: what this catches is drift
  # (a new runner image, a pinned managed download rotting), which moves on
  # the scale of weeks.
  schedule:
    - cron: "17 6 * * 1"

env:
  CARGO_TERM_COLOR: always

jobs:
  # Runs on a bare runner with NO conversion backends installed. This is the
  # whole point: convkit's primary test suite (the recipe-snapshot tests in
  # crates/convkit-core/tests/recipes.rs) asserts
  # the exact argv convkit would hand to ffmpeg/magick/pandoc/soffice
  # without ever invoking them, so it must be green with zero backends on
  # PATH on every platform. If this job needs a backend to pass, the
  # project's central testing claim is false.
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install rustfmt and clippy
        run: rustup component add rustfmt clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy --all-targets -- -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test --workspace
        run: cargo test --workspace

      # convkit-core is a library: all user-facing output (progress, errors,
      # JSON, doctor/capabilities tables) belongs to the `conv` binary crate.
      # A print statement sneaking into core would either duplicate output
      # under `--json` or corrupt a machine consumer's stdout, so this is
      # enforced in CI, not just by convention. Test code is excluded
      # because assertions inside `#[cfg(test)]` blocks are allowed to
      # print for debugging and never ship in the built library: every file
      # in this crate declares its test module as exactly `mod tests` at
      # column 0 as the last top-level item, so each file is truncated at
      # that marker before being grepped -- scoping by *position in the
      # file*, not (as a previous version of this check tried and failed to
      # do) by grepping for the literal text "mod tests" on the matched
      # line itself, which a `println!`/`eprintln!`/etc. call's own text
      # almost never contains, so that version never actually filtered
      # anything. Truncating at `#[cfg(test)]` instead would be wrong too:
      # registry.rs has a `#[cfg(test)] use ...;` item attribute above its
      # non-test body, which would truncate the file before the body it's
      # meant to guard even starts.
      - name: core must not print
        shell: bash
        run: |
          fail=0
          while IFS= read -r -d '' f; do
            hit=$(sed -n '/^mod tests/q;p' "$f" \
                  | grep -nE '\b(println!|eprintln!|dbg!|print!|eprint!)' || true)
            if [ -n "$hit" ]; then
              echo "$f:"
              echo "$hit"
              fail=1
            fi
          done < <(find crates/convkit-core/src -name '*.rs' -print0)
          if [ "$fail" -eq 1 ]; then
            echo "convkit-core must never write to stdout/stderr"
            exit 1
          fi

  # Ubuntu only: installs every real backend via apt, then runs the
  # `#[ignore]`-gated output-property suite that exercises them for real
  # (§10.2). This is the job that actually shells out to ffmpeg, magick,
  # soffice, and pandoc.
  integration:
    name: integration (ubuntu, real backends)
    runs-on: ubuntu-latest
    # A few minutes when healthy. A hung backend otherwise holds the job for
    # GitHub's six-hour default, and its log only appears once the job ends.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2

      # The ~400 MB of .deb files the next step installs, kept between runs
      # so apt only downloads what changed upstream. Ubuntu's mirror has
      # served them at under 100 kB/s for hours at a time, which no job
      # timeout survives. The key changes weekly so packages that updates
      # replaced drop out; the restore key starts each week from the last.
      - name: Week for the apt cache key
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Restore cached apt packages
        id: apt-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/apt-archives
          key: apt-${{ runner.os }}-${{ steps.week.outputs.week }}
          restore-keys: apt-${{ runner.os }}-

      # Debian/Ubuntu split libheif's HEVC decoder out of the base
      # `imagemagick` -> libheif1 dependency chain and into its own plugin
      # package (a patent-licensing decision upstream, not a packaging
      # oversight): on `ubuntu-latest` (24.04/noble, amd64), `libheif1`'s
      # own Depends excludes `libheif-plugin-libde265` specifically on
      # amd64/i386 architectures, so `apt-get install imagemagick` alone
      # gives ImageMagick a HEIF *container* reader with no HEVC *decoder*
      # behind it -- it recognises a `.heic` file and then fails decoding
      # it with "Unsupported codec". Installing the plugin explicitly is
      # the fix; see README.md's Backends section for the user-facing
      # version of this.
      #
      # A minute or two when healthy. A stalled mirror fails here, by name,
      # rather than using up the job's budget before any test runs.
      - name: Install backends
        timeout-minutes: 10
        run: |
          mkdir -p ~/apt-archives
          find ~/apt-archives -maxdepth 1 -name '*.deb' -exec sudo cp -t /var/cache/apt/archives/ {} +
          sudo apt-get update
          sudo apt-get install -y -o Acquire::Retries=3 ffmpeg imagemagick libheif-plugin-libde265 libreoffice pandoc
          # Drop versions an update has replaced, so the cache does not grow
          # by a week's worth of stale packages each week.
          sudo apt-get autoclean
          rm -f ~/apt-archives/*.deb
          find /var/cache/apt/archives -maxdepth 1 -name '*.deb' -exec cp -t ~/apt-archives/ {} +
          echo "$(find ~/apt-archives -name '*.deb' | wc -l) packages ready to cache"

      - name: Save apt packages
        if: steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/apt-archives
          key: apt-${{ runner.os }}-${{ steps.week.outputs.week }}

      # Isolates "the environment can decode HEIC" from "our recipe is
      # correct": this drives the system ImageMagick binary directly, with
      # no convkit code involved, so a failure here always means the apt
      # step above didn't actually give ImageMagick a working HEVC decoder
      # -- never a convkit bug -- and fails loudly right here instead of
      # surfacing later as a confusing red property test.
      - name: Verify system ImageMagick can decode HEIC (HEVC delegate present)
        run: |
          if command -v magick >/dev/null 2>&1; then
            im_convert=(magick convert)
          else
            im_convert=(convert)
          fi
          out="$(mktemp --suffix=.jpg)"
          if ! "${im_convert[@]}" tests/fixtures/photo.heic "$out"; then
            echo "::error::ImageMagick could not decode tests/fixtures/photo.heic -- HEIC container support is present but the HEVC decoder is missing. On Debian/Ubuntu this means the libheif HEVC decoder plugin isn't installed (see the 'Install backends' step and README.md's Backends section)." >&2
            exit 1
          fi
          echo "HEIC decode OK: $(stat -c%s "$out") bytes written to $out"

      - name: cargo build --workspace
        run: cargo build --workspace

      - name: cargo test --workspace -- --ignored (real backends)
        run: cargo test --workspace -- --ignored

  # The Windows half of the same idea, and the job whose absence let three
  # Windows-only defects reach a user rather than CI: the `soffice.com`
  # launcher choice, the LibreOffice profile blowing past MAX_PATH, and
  # missing CREATE_NO_WINDOW were all found by running conv by hand on a
  # Windows machine. The `test` matrix above does run on windows-latest, but
  # with zero backends, so it can only ever check the argv convkit would
  # have produced.
  #
  # Deliberately not on the push path. LibreOffice from Chocolatey is a
  # several-hundred-megabyte install and the slowest, least reliable step
  # here, and gating every push on it buys less than it costs for a project
  # this size. Run it from the Actions tab before cutting a release, and let
  # the weekly schedule catch drift in between.
  integration-windows:
    name: integration (windows, real backends)
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: windows-latest
    # As on ubuntu; the LibreOffice install makes this one slower.
    timeout-minutes: 30
    # The LibreOffice installer the job runs, pinned. To move to a newer
    # LibreOffice, upload its unmodified x64 MSI to this repo's `ci-assets`
    # pre-release and change both values.
    env:
      LIBREOFFICE_VERSION: "26.2.6"
      LIBREOFFICE_MSI_SHA256: "f9877032fd908beb9c0ddf06df4af5c2e85f419c42e14876c4cce5aae5fb2660"
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2

      - name: cargo build --workspace
        run: cargo build --workspace

      # ffmpeg, ffprobe, pandoc and typst come from convkit's own managed
      # installer rather than a package manager. That is the same pinned
      # URL-plus-SHA-256 path a Windows user gets from `conv install`, so
      # this exercises the installer on Windows as a side effect -- the
      # `.exe` managed filenames in particular have no other coverage.
      - name: Install managed backends via conv itself
        run: |
          $conv = ".\target\debug\conv.exe"
          # `install ffmpeg` brings ffprobe with it -- they come from one
          # archive -- so asking for both would download it twice.
          foreach ($b in @("ffmpeg", "pandoc", "typst")) {
            & $conv install $b --yes
            if ($LASTEXITCODE -ne 0) { throw "conv install $b failed ($LASTEXITCODE)" }
          }

      # The LibreOffice installer comes from the cache, or else from this
      # repo's own `ci-assets` pre-release, never from LibreOffice's mirror:
      # that mirror timed out for hours on 2026-10-02 and failed this job
      # twice, through Chocolatey, which downloads from it. The cache saves
      # the ~370 MB download; GitHub evicts an entry unused for 7 days,
      # which a weekly job can just miss, so the release asset is what the
      # job falls back on. Either way the checksum below is checked before
      # the installer runs.
      - name: Restore the cached LibreOffice installer
        id: lo-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/libreoffice
          key: libreoffice-${{ env.LIBREOFFICE_VERSION }}-win-x64

      - name: Fetch the LibreOffice installer from ci-assets
        if: steps.lo-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\libreoffice" | Out-Null
          gh release download ci-assets --repo "${{ github.repository }}" `
            --pattern "LibreOffice_$($env:LIBREOFFICE_VERSION)_Win_x86-64.msi" `
            --dir "$env:RUNNER_TEMP\libreoffice"
          if ($LASTEXITCODE -ne 0) { throw "could not download the LibreOffice installer from ci-assets" }

      # ImageMagick ships on some runner images and not others, so this
      # checks rather than assumes. LibreOffice never ships and is always
      # installed; it is what puts `soffice.com` at the well-known path the
      # resolver looks for, which is the Windows-specific behaviour with the
      # worst track record. The MSI installs where Chocolatey's package put
      # it, C:\Program Files\LibreOffice, with the same silent arguments.
      - name: Install ImageMagick and LibreOffice
        run: |
          if (-not (Get-Command magick -ErrorAction SilentlyContinue)) {
            choco install imagemagick --no-progress -y
          }
          $msi = "$env:RUNNER_TEMP\libreoffice\LibreOffice_$($env:LIBREOFFICE_VERSION)_Win_x86-64.msi"
          $hash = (Get-FileHash -Algorithm SHA256 $msi).Hash.ToLower()
          if ($hash -ne $env:LIBREOFFICE_MSI_SHA256) {
            throw "LibreOffice installer checksum mismatch: got $hash"
          }
          $log = "$env:RUNNER_TEMP\libreoffice-install.log"
          $p = Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /qn /norestart /l*v `"$log`"" -Wait -PassThru
          if ($p.ExitCode -notin 0, 3010) {
            Get-Content $log -Tail 60
            throw "LibreOffice install failed ($($p.ExitCode))"
          }

      # Saved only once the checksum has passed, so a bad download is never
      # cached.
      - name: Save the LibreOffice installer to the cache
        if: steps.lo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/libreoffice
          key: ${{ steps.lo-cache.outputs.cache-primary-key }}

      - name: conv doctor
        run: |
          $env:PATH = "C:\Program Files\LibreOffice\program;$env:PATH"
          .\target\debug\conv.exe doctor

      # Same reasoning as the Ubuntu job's HEIC check: separate "this
      # ImageMagick can decode HEVC" from "our recipe is correct", so a
      # decoder gap fails here by name instead of surfacing later as a
      # confusing property-test failure.
      - name: Verify ImageMagick can decode HEIC
        run: |
          magick tests\fixtures\photo.heic "$env:RUNNER_TEMP\heic-check.jpg"
          if ($LASTEXITCODE -ne 0) { throw "ImageMagick could not decode tests/fixtures/photo.heic" }
          Get-Item "$env:RUNNER_TEMP\heic-check.jpg" | Select-Object Length

      # The suite this job exists for. It includes the deep-destination
      # regression tests, which only mean anything here: on Linux a
      # 240-character path is unremarkable, so those tests are inert in the
      # Ubuntu job that is currently the only place they run.
      - name: cargo test --workspace -- --ignored (real backends)
        run: cargo test --workspace -- --ignored
