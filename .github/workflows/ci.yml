name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Runs on a bare runner with NO conversion backends installed. This is the
  # whole point: convkit's primary test suite (the recipe-snapshot tests --
  # see docs/superpowers/specs/2026-08-29-convkit-design.md §10.1) asserts
  # the exact argv convkit would hand to ffmpeg/magick/pandoc/soffice
  # without ever invoking them, so it must be green with zero backends on
  # PATH on every platform. If this job needs a backend to pass, the
  # project's central testing claim is false.
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install rustfmt and clippy
        run: rustup component add rustfmt clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy --all-targets -- -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test --workspace
        run: cargo test --workspace

      # convkit-core is a library: all user-facing output (progress, errors,
      # JSON, doctor/capabilities tables) belongs to the `conv` binary crate.
      # A print statement sneaking into core would either duplicate output
      # under `--json` or corrupt a machine consumer's stdout, so this is
      # enforced in CI, not just by convention. Test code is excluded
      # because assertions inside `#[cfg(test)]` blocks are allowed to
      # print for debugging and never ship in the built library: every file
      # in this crate declares its test module as exactly `mod tests` at
      # column 0 as the last top-level item, so each file is truncated at
      # that marker before being grepped -- scoping by *position in the
      # file*, not (as a previous version of this check tried and failed to
      # do) by grepping for the literal text "mod tests" on the matched
      # line itself, which a `println!`/`eprintln!`/etc. call's own text
      # almost never contains, so that version never actually filtered
      # anything. Truncating at `#[cfg(test)]` instead would be wrong too:
      # registry.rs has a `#[cfg(test)] use ...;` item attribute above its
      # non-test body, which would truncate the file before the body it's
      # meant to guard even starts.
      - name: core must not print
        shell: bash
        run: |
          fail=0
          while IFS= read -r -d '' f; do
            hit=$(sed -n '/^mod tests/q;p' "$f" \
                  | grep -nE '\b(println!|eprintln!|dbg!|print!|eprint!)' || true)
            if [ -n "$hit" ]; then
              echo "$f:"
              echo "$hit"
              fail=1
            fi
          done < <(find crates/convkit-core/src -name '*.rs' -print0)
          if [ "$fail" -eq 1 ]; then
            echo "convkit-core must never write to stdout/stderr"
            exit 1
          fi

  # Ubuntu only: installs every real backend via apt, then runs the
  # `#[ignore]`-gated output-property suite that exercises them for real
  # (§10.2). This is the job that actually shells out to ffmpeg, magick,
  # soffice, and pandoc.
  integration:
    name: integration (ubuntu, real backends)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2

      # Debian/Ubuntu split libheif's HEVC decoder out of the base
      # `imagemagick` -> libheif1 dependency chain and into its own plugin
      # package (a patent-licensing decision upstream, not a packaging
      # oversight): on `ubuntu-latest` (24.04/noble, amd64), `libheif1`'s
      # own Depends excludes `libheif-plugin-libde265` specifically on
      # amd64/i386 architectures, so `apt-get install imagemagick` alone
      # gives ImageMagick a HEIF *container* reader with no HEVC *decoder*
      # behind it -- it recognises a `.heic` file and then fails decoding
      # it with "Unsupported codec". Installing the plugin explicitly is
      # the fix; see README.md's Backends section for the user-facing
      # version of this.
      - name: Install backends
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick libheif-plugin-libde265 libreoffice pandoc

      # Isolates "the environment can decode HEIC" from "our recipe is
      # correct": this drives the system ImageMagick binary directly, with
      # no convkit code involved, so a failure here always means the apt
      # step above didn't actually give ImageMagick a working HEVC decoder
      # -- never a convkit bug -- and fails loudly right here instead of
      # surfacing later as a confusing red property test.
      - name: Verify system ImageMagick can decode HEIC (HEVC delegate present)
        run: |
          if command -v magick >/dev/null 2>&1; then
            im_convert=(magick convert)
          else
            im_convert=(convert)
          fi
          out="$(mktemp --suffix=.jpg)"
          if ! "${im_convert[@]}" tests/fixtures/photo.heic "$out"; then
            echo "::error::ImageMagick could not decode tests/fixtures/photo.heic -- HEIC container support is present but the HEVC decoder is missing. On Debian/Ubuntu this means the libheif HEVC decoder plugin isn't installed (see the 'Install backends' step and README.md's Backends section)." >&2
            exit 1
          fi
          echo "HEIC decode OK: $(stat -c%s "$out") bytes written to $out"

      - name: cargo build --workspace
        run: cargo build --workspace

      - name: cargo test --workspace -- --ignored (real backends)
        run: cargo test --workspace -- --ignored
