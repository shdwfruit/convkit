[workspace]
members = ["crates/convkit-core", "crates/conv"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["shdwfruit"]
repository = "https://github.com/shdwfruit/convkit"
homepage = "https://github.com/shdwfruit/convkit"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
