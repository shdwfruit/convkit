[package]
name = "convkit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "One command for everyday file conversion, offline"
readme = "../../README.md"
keywords = ["convert", "ffmpeg", "pandoc", "imagemagick", "cli"]
categories = ["command-line-utilities", "multimedia"]

[package.metadata.wix]
upgrade-guid = "E9BFE898-D5AA-4900-BB79-0448F6DCD057"
path-guid = "73EF7E39-82E0-4608-BDA9-B46D2B83D699"
license = false
eula = false

[[bin]]
name = "conv"
path = "src/main.rs"

[dependencies]
convkit-core = { path = "../convkit-core", version = "0.1.0" }
clap = { version = "4", features = ["derive"] }
wild = "2"
serde.workspace = true
serde_json.workspace = true
rayon = "1"
indicatif = "0.17"
# Already in the dependency tree transitively via clap's own colour support
# -- used directly here (Part 2) for the same ANSI styling machinery, gated
# on `std::io::IsTerminal`, rather than adding a new styling dependency.
anstyle = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
insta = { version = "1", features = ["yaml"] }
tempfile = "3"
