[package]
name = "convkit-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Conversion planning and execution engine for convkit"

[dependencies]
serde.workspace = true
serde_json.workspace = true
strsim = "0.11"
which = "8"
ureq = "2"
sha2 = "0.10"
# Also archives (`archive`): deflate64 is what Windows uses for a zip over
# 2 GB, and aes-crypto reads and writes AES-256 password zips.
zip = { version = "2", default-features = false, features = ["deflate", "deflate64", "aes-crypto"] }
tar = "0.4"
flate2 = "1"
# Archives. lzma-rust2 writes and reads .tar.xz in pure Rust (lzma-rs below
# only decodes, and its encoder does not search for matches); bzip2's default
# backend is the Rust port of libbz2; sevenz-rust2 reads 7z, on the same
# lzma-rust2. zstd is the one C library: the pure-Rust ruzstd only encodes at
# its "fastest" level, which made a .tar.zst larger than the same .tar.gz
# (271 KB against 211 KB, where zstd -3 makes 47 KB). It builds with the C
# toolchain ring already needs. filetime is already in the tree through tar.
lzma-rust2 = { version = "0.15", default-features = false, features = ["std", "encoder", "optimization", "xz"] }
bzip2 = "0.6"
zstd = { version = "0.13", default-features = false }
# ~0.20.0 and 0.20.1 in the lock: 0.20.2 moved to lzma-rust2 0.16, which
# brings a second sha2 and digest into the tree.
sevenz-rust2 = { version = "~0.20.0", default-features = false, features = ["aes256", "bzip2"] }
filetime = "0.2"
# Pure-Rust xz/LZMA decoder (`#![forbid(unsafe_code)]`, no C dependency) so
# `Packaging::TarXz` doesn't need `xz2`/`liblzma-sys`, which link C and would
# make the Windows build fragile.
lzma-rs = "0.3"
# conv qr, all pure Rust: qrcode encodes the text, resvg draws the code and
# its logo (no text or font support, which a QR code itself never needs),
# rqrr reads the drawing back to prove it scans. png writes the file and
# base64 embeds the logo in the SVG; both are already in the tree, through
# resvg and ureq.
qrcode = { version = "0.14", default-features = false }
# `text`, `system-fonts` and `memmap-fonts` draw burned-in subtitles with
# the system's own fonts: shaping, fallback and right-to-left text.
resvg = { version = "0.48", default-features = false, features = ["raster-images", "text", "system-fonts", "memmap-fonts"] }
unicode-bidi = "0.3"
# Which system font holds a line's letters; already in through resvg.
skrifa = { version = "0.44", default-features = false, features = ["std"] }
rqrr = { version = "0.10", default-features = false }
png = "0.18"
base64 = "0.22"
# JSON, YAML, TOML and CSV, converted in process (`data`). JSON is read and
# written by conv's own code, which keeps every number's digits and every
# key's place; serde_json's `arbitrary_precision` and `preserve_order` would
# do it too, but they are features of the one serde_json the whole
# workspace shares, and would reorder every --json envelope conv prints.
# saphyr-parser is the event parser of the maintained successor to
# yaml-rust (yaml-rust2 now only gets basic maintenance; serde_yaml is
# archived and serde_yml deprecated): events with spans, so conv decides
# what aliases, tags and plain scalars mean itself. toml_edit parses TOML
# with each number's text; toml_datetime checks a YAML timestamp is one
# TOML can hold.
saphyr-parser = "0.3"
toml_edit = { version = "0.25", default-features = false, features = ["parse"] }
toml_datetime = "1"
csv = "1"
# Lines up the caret under a data error, where a character can take two
# columns. Already in the tree through console.
unicode-width = "0.2"
# The developer and text tools (conv base64, hash, uuid, jwt, time, link,
# count, case, chars, lorem, diff), all in-process. md-5, sha1 and hmac are
# the RustCrypto releases on the same digest as sha2 above, so they add no
# second copy of it.
md-5 = "0.10"
sha1 = "0.10"
hmac = "0.12"
# 1.26 is the newest uuid that builds on this workspace's Rust 1.85.
uuid = { version = "~1.26", features = ["v4", "v7"] }
# Dates, offsets and time zones from the system's tz database (bundled on
# Windows, which has none).
jiff = "0.2"
# Words, sentences and grapheme clusters by Unicode's own rules (UAX #29),
# so CJK text and emoji count right.
unicode-segmentation = "1"
# Character names, general categories and scripts for conv chars.
unicode_names2 = "4"
unicode-properties = { version = "0.1", default-features = false, features = ["general-category", "emoji"] }
unicode-script = "0.5"
# Reading percent-encoded URLs and data: URIs. Already in the tree through
# ureq.
percent-encoding = "2"
# Splitting words for camelCase, snake_case and the rest. Already in the
# tree through clap's derive macros.
heck = "0.5"
# Line diffs with the changed words inside changed lines. Already in the
# tree as insta's.
similar = { version = "2.7", default-features = false, features = ["text", "inline", "unicode"] }
# conv colors, conv beautify and conv qr --read decode JPEG, GIF and WebP
# themselves with the decoders resvg already brings in to draw a logo, at
# the same versions, so a screenshot or a phone photo needs no backend.
zune-jpeg = "0.5"
gif = { version = "0.14", default-features = false, features = ["std"] }
image-webp = "0.2"
# The owner password of a restricted PDF lock: random, and never shown.
# Already in the tree through ring.
getrandom = "0.2"
# --compress and --max-size on PDFs, all pure Rust under MIT or Apache-2.0:
# lopdf reads the page tree, content streams and images; jpeg-decoder
# decodes JPEGs, CMYK and YCCK included; fast_image_resize downsamples;
# jpeg-encoder writes the JPEGs, CMYK as YCCK. qpdf still does every write
# of the PDF itself.
lopdf = { version = "0.45", default-features = false }
jpeg-decoder = { version = "0.3", default-features = false }
jpeg-encoder = { version = "0.7", default-features = false, features = ["std", "simd"] }
fast_image_resize = { version = "6", default-features = false, features = ["std"] }

# Archives: a zip's plain DOS time is local time, read and written with
# mktime/localtime_r, and an archive's quarantine mark is copied to what it
# unpacks (macOS). Already in the tree through several crates.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
# The archive tests write 7z fixtures; the encoder stays out of the build.
sevenz-rust2 = { version = "~0.20.0", default-features = false, features = ["aes256", "bzip2", "compress", "util"] }
insta = { version = "1", features = ["yaml"] }
