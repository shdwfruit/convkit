[package]
name = "convkit-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Conversion planning and execution engine for convkit"

[dependencies]
serde.workspace = true
serde_json.workspace = true
strsim = "0.11"
which = "8"
ureq = "2"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
# Pure-Rust xz/LZMA decoder (`#![forbid(unsafe_code)]`, no C dependency) so
# `Packaging::TarXz` doesn't need `xz2`/`liblzma-sys`, which link C and would
# make the Windows build fragile.
lzma-rs = "0.3"
# conv qr, all pure Rust: qrcode encodes the text, resvg draws the code and
# its logo (no text or font support, which a QR code itself never needs),
# rqrr reads the drawing back to prove it scans. png writes the file and
# base64 embeds the logo in the SVG; both are already in the tree, through
# resvg and ureq.
qrcode = { version = "0.14", default-features = false }
resvg = { version = "0.48", default-features = false, features = ["raster-images"] }
rqrr = { version = "0.10", default-features = false }
png = "0.18"
base64 = "0.22"
# JSON, YAML, TOML and CSV, converted in process (`data`). JSON is read and
# written by conv's own code, which keeps every number's digits and every
# key's place; serde_json's `arbitrary_precision` and `preserve_order` would
# do it too, but they are features of the one serde_json the whole
# workspace shares, and would reorder every --json envelope conv prints.
# saphyr-parser is the event parser of the maintained successor to
# yaml-rust (yaml-rust2 now only gets basic maintenance; serde_yaml is
# archived and serde_yml deprecated): events with spans, so conv decides
# what aliases, tags and plain scalars mean itself. toml_edit parses TOML
# with each number's text; toml_datetime checks a YAML timestamp is one
# TOML can hold.
saphyr-parser = "0.3"
toml_edit = { version = "0.25", default-features = false, features = ["parse"] }
toml_datetime = "1"
csv = "1"
# Lines up the caret under a data error, where a character can take two
# columns. Already in the tree through console.
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3"
insta = { version = "1", features = ["yaml"] }
