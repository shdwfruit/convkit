[package]
name = "convkit-diff"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Differential conversion harness: substantiates convkit's quality claim and gates future engine swaps"
publish = false

[[bin]]
name = "convkit-diff"
path = "src/main.rs"

[dependencies]
convkit-core = { path = "../convkit-core", version = "0.2.0" }
clap = { version = "4", features = ["derive"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
tempfile = "3"

[dev-dependencies]
tempfile = "3"
